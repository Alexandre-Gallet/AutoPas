# This yaml file creates a simple simulation box to be run with 3-body functors.
container                            :  [VerletLists] # DirectSum
functor-3b                           :  axilrod-teller-muto
traversal-3b                         :  [vl_list_iteration] # ds_sequential
newton3-3b                           :  [disabled]
data-layout-3b                       :  [AoS]

# Comment out to isolate 3-body interactions, but this makes simulation unphysical
functor                              :  lj-hwy
traversal                            :  [vl_list_iteration]
newton3                              :  [disabled]
data-layout                          :  [AoS]

verlet-rebuild-frequency             :  1
verlet-skin-radius                   :  0.2
selector-strategy                    :  Fastest-Absolute-Value
tuning-strategies                    :  []
tuning-interval                      :  2000
tuning-samples                       :  3
tuning-max-evidence                  :  10

cutoff                               :  2.5
cell-size                            :  [1]
deltaT                               :  0.0002
iterations                           :  100
boundary-type                        :  [periodic, periodic, periodic]
fastParticlesThrow                   :  false

Sites:
  0:
    epsilon                          :  1.
    sigma                            :  1.
    mass                             :  1.
    nu                               :  0.073 # Value for Argon
Objects:
  CubeClosestPacked:
    0:
      box-length                     :  [12, 12, 12]
      bottomLeftCorner               :  [0, 0, 0]
      particle-spacing               :  1.2
#      particle-density               :  1.0
      velocity                       :  [0, 0, 0]
      particle-type-id               :  0
      structure                      : fcc
      centered                       : true
thermostat:
  initialTemperature                 :  1.1
  targetTemperature                  :  1.1
  deltaTemperature                   :  0.5
  thermostatInterval                 :  25
  addBrownianMotion                  :  true

log-level                            :  warn
no-end-config                        :  true
no-progress-bar                      :  false
vtk-filename                         :  3BodyTestAlexandreThesis
vtk-output-folder                    :  3BodyTestAlexandreThesisOutput
vtk-write-frequency                  :  10
#log-file                            : log.txt
